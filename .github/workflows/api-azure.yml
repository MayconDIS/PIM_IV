# Publica a API C# do Nex_TI (pratica/apps/api) no Azure App Service.
#
# Configuração no GitHub (Settings → Secrets and variables → Actions):
#   - Variable  AZURE_WEBAPP_NAME             nome do App Service (ex.: nexti-api)
#   - Secret    AZURE_WEBAPP_PUBLISH_PROFILE  conteúdo do "Download publish profile" do portal
# O App Service precisa estar com "SCM Basic Auth Publishing Credentials" ligado
# (Configuration → General settings) para o publish profile funcionar.

name: API → Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'pratica/apps/api/**'
      - 'pratica/tests/NexTI_API.Tests/**'
      - '.github/workflows/api-azure.yml'
  workflow_dispatch:

concurrency:
  group: api-azure
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testes
        run: dotnet test pratica/tests/NexTI_API.Tests/NexTI_API.Tests.csproj -c Release

      - name: Publicar
        run: dotnet publish pratica/apps/api/NexTI_API.csproj -c Release -o ${{ runner.temp }}/api

      - name: Deploy no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/api
