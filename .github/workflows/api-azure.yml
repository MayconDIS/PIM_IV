# Publica a API C# do Nex_TI (sistema/apps/api) no Azure App Service.
#
# Configuração no GitHub (Settings → Secrets and variables → Actions):
#   - Variable  AZURE_WEBAPP_NAME             nome do App Service (ex.: nexti-api)
#   - Secret    AZURE_WEBAPP_PUBLISH_PROFILE  conteúdo do "Download publish profile" do portal
# O App Service precisa estar com "SCM Basic Auth Publishing Credentials" ligado
# (Configuration → General settings) para o publish profile funcionar.

name: API → Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'sistema/apps/api/**'
      - 'sistema/tests/NexTI_API.Tests/**'
      - '.github/workflows/api-azure.yml'
  workflow_dispatch:

concurrency:
  group: api-azure
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testes
        run: dotnet test sistema/tests/NexTI_API.Tests/NexTI_API.Tests.csproj -c Release

      - name: Publicar
        run: dotnet publish sistema/apps/api/NexTI_API.csproj -c Release -o ${{ runner.temp }}/api

      - name: Deploy no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/api

      # Depois de publicar, confere a API de verdade: em 24/10 ela subiu respondendo /api/status, mas com
      # erro 500 nas rotas que usam o banco (resolvido reiniciando o App Service). Se isso voltar, a
      # publicação fica vermelha no GitHub em vez de passar despercebida.
      - name: Conferir a API publicada
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api"
          for rota in status fases; do
            for tentativa in $(seq 1 20); do
              codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL/$rota" || true)
              [ "$codigo" = "200" ] && break
              sleep 15
            done
            echo "/api/$rota -> HTTP $codigo"
            if [ "$codigo" != "200" ]; then
              echo "::error::A API publicada não respondeu 200 em /api/$rota. Reinicie o App Service no portal da Azure e confira os logs."
              exit 1
            fi
          done
